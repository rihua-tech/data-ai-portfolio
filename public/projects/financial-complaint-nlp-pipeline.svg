<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NLP Classification Pipeline</title>
  <desc id="desc">A dark themed pipeline diagram for financial complaint auto-routing with NLP.</desc>
  <rect width="1200" height="800" fill="#020617"/>
